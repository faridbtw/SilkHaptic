<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title description">
  <title id="title">SilkHaptic</title>
  <desc id="description">SilkHaptic in white and red on charcoal. DualSense haptics for Silksong on macOS, over USB-C or Bluetooth.</desc>
  <rect width="1280" height="320" fill="#111111"/>
  <rect x="0" y="0" width="6" height="320" fill="#ed5148"/>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
    <text x="72" y="68" fill="#929292" font-size="16">A SILKSONG MOD FOR macOS</text>
    <text x="68" y="177" fill="#f4f3ef" font-size="88" font-weight="700" letter-spacing="-4">Silk<tspan fill="#ed5148">Haptic</tspan></text>
    <text x="73" y="234" fill="#b6b6b2" font-size="23">Your DualSense. The game’s PS5 haptics.</text>
    <path d="M910 78V242" stroke="#363636"/>
    <circle cx="961" cy="132" r="4" fill="#ed5148"/>
    <text x="981" y="139" fill="#f4f3ef" font-size="22">USB-C</text>
    <circle cx="961" cy="193" r="4" fill="#ed5148"/>
    <text x="981" y="200" fill="#f4f3ef" font-size="22">Bluetooth</text>
  </g>
</svg>
