 <linearGradient id="silk" x2="1"><stop stop-color="#aa9de6" stop-opacity="0"/><stop offset=".5" stop-color="#c4b7ff" stop-opacity=".6"/><stop offset="1" stop-color="#c4b7ff" stop-opacity="0"/></linearGradient>
</defs>
