<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">SilkHaptic — Feel every thread</title>
<desc id="desc">The original SilkHaptic layout in cream and red, with flowing lines and Sony’s official Volcanic Red DualSense product image. USB and Bluetooth haptics for Silksong on macOS.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171115"/><stop offset="1" stop-color="#2d171d"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#e24b4b" stop-opacity=".15"/><stop offset="1" stop-color="#e24b4b" stop-opacity="0"/></radialGradient>
 <linearGradient id="silk" x2="1"><stop stop-color="#b84747" stop-opacity="0"/><stop offset=".5" stop-color="#f07a72" stop-opacity=".6"/><stop offset="1" stop-color="#f07a72" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1280" height="400" rx="22" fill="url(#bg)"/>
<ellipse cx="1005" cy="197" rx="335" ry="270" fill="url(#glow)"/>
<g fill="none" stroke="url(#silk)" stroke-width="1.2">
 <path d="M600 88 C800 8 831 343 1190 96 S1430 225 1320 275"/>
 <path d="M598 105 C800 25 831 360 1190 113 S1430 242 1320 292"/>
 <path d="M596 122 C800 42 831 377 1190 130 S1430 259 1320 309"/>
 <path d="M594 139 C800 59 831 394 1190 147 S1430 276 1320 326"/>
</g>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
 <text x="76" y="82" fill="#e4a7a7" font-size="13" font-weight="600" letter-spacing="4">SILKSONG · MACOS · DUALSENSE</text>
 <text x="72" y="181" fill="#faf4e8" font-family="Georgia,'Times New Roman',serif" font-size="78" letter-spacing="-3">SilkHaptic</text>
 <text x="77" y="228" fill="#e3cfd2" font-size="24" font-weight="300">Feel every thread.</text>
 <text x="77" y="270" fill="#b5a2a7" font-size="17">Footsteps. Dashes. Landings. In your hands.</text>
 <g transform="translate(77 306)">
  <rect width="100" height="32" rx="16" fill="#f17a72" fill-opacity=".1" stroke="#d17b79" stroke-opacity=".3"/>
  <text x="50" y="21" text-anchor="middle" fill="#f2cfce" font-size="12" letter-spacing="1">USB-C</text>
  <rect x="112" width="140" height="32" rx="16" fill="#f17a72" fill-opacity=".1" stroke="#d17b79" stroke-opacity=".3"/>
  <text x="182" y="21" text-anchor="middle" fill="#f2cfce" font-size="12" letter-spacing="1">BLUETOOTH</text>
 </g>
</g>
